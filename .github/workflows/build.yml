name: Build QWRT sysupgrade

on:
  workflow_dispatch:
  push:
    branches: ["main"]

env:
  OWRT_REPO: https://github.com/kravasuper/openwrt.git
  OWRT_BRANCH: xiaomi_be7000
  OWRT_COMMIT: 790d036a
  VERSION_STRING: r20260623-790d036a
  PROJECT_RELEASE: 1.3.1
  PROJECT_SOURCE_COMMIT: 8b7c2fb3372a548fd3562ee4f77d2ce9691ba1f3
  PROJECT_VERSION: 1.3.1-QWRT
  CCACHE_MAXSIZE: 2G
  ARCH: aarch64_cortex-a73
  TARGET: qualcommbe/ipq95xx
  DEVICE: openwrt-qualcommbe-ipq95xx-xiaomi_be7000

permissions:
  contents: read

concurrency:
  group: build-qwrt
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 340

    steps:
      - uses: actions/checkout@v4
        with:
          path: repo

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget time

      - name: Check out the pinned OpenWrt port
        run: |
          git clone --branch "$OWRT_BRANCH" --single-branch "$OWRT_REPO" owrt
          cd owrt
          git checkout "$OWRT_COMMIT"
          echo "$VERSION_STRING" > version

      - name: Apply QWRT profile and overlay
        run: |
          cd owrt
          for p in ../repo/patches/*.patch; do
            cp "$p" target/linux/qualcommbe/patches-6.18/
          done
          mkdir -p package/kernel/mac80211/patches/ath12k
          cp -a ../repo/patches/mac80211-ath12k/. package/kernel/mac80211/patches/ath12k/
          # The pinned Krava port's existing 307 patch has a malformed hunk
          # count (7/6 although its actual counts are 6/5); fix it before the
          # backports patch series is applied.
          python3 - <<'PY'
          from pathlib import Path
          p = Path("package/kernel/mac80211/patches/ath12k/307-wifi-ath12k-avoid-duplicate-soc-debugfs-files.patch")
          text = p.read_text()
          old = "@@ -14387,7 +14387,6 @@"
          new = "@@ -14387,6 +14387,5 @@"
          if text.count(old) != 1:
              raise SystemExit("unexpected Krava ath12k patch 307; refusing an unverified rewrite")
          p.write_text(text.replace(old, new))
          PY
          grep -q '^@@ -14387,6 +14387,5 @@' package/kernel/mac80211/patches/ath12k/307-wifi-ath12k-avoid-duplicate-soc-debugfs-files.patch
          # Apply shared changes first, except slot-specific patches and the
          # RF GPIO conversion, which needs the QWRT DTS's GPIO hogs in place.
          for p in ../repo/patches/tree/*.patch; do
            case "$p" in
              *001-dts-be7000.patch|*003-sysupgrade-slot.patch|*005-dts-be7000-no-l2-rpm-vote.patch|*007-dts-be7000-rf-select-pinctrl.patch) continue ;;
            esac
            patch --batch --forward -p1 < "$p"
          done
          patch --batch --forward -p1 < ../repo/profiles/qwrt/patches/tree/001-dts-be7000.patch
          # v1.3.1 needs the RF lines free for be7000-5g-split; this patch
          # converts the equivalent GPIO hogs in the QWRT DTS to pinctrl.
          patch --batch --forward -p1 < ../repo/patches/tree/007-dts-be7000-rf-select-pinctrl.patch
          for p in ../repo/profiles/qwrt/patches/tree/002-ubi-volume.patch \
                   ../repo/profiles/qwrt/patches/tree/003-sysupgrade.patch; do
            patch --batch --forward -p1 < "$p"
          done
          mkdir -p files
          cp -a ../repo/overlay-files/. files/
          cp -a ../repo/profiles/qwrt/overlay-files/. files/
          chmod 0755 files/etc/uci-defaults/40_bigoverlay \
                     files/etc/init.d/be7000-bootconfirm
          cp -a ../repo/awg-feed .
          cp -a ../repo/luci-theme-nimbus package/

      - name: Pin and install package feeds
        run: |
          cd owrt
          while read -r name rev _; do
            [ -n "$name" ] || continue
            sed -i -E "s|^(src-git(-full)? $name [^ ^;]+).*$|\1^$rev|" feeds.conf.default
          done < ../repo/feeds-pins.txt
          for name in $(cut -d" " -f1 ../repo/feeds-pins.txt); do
            grep -q "^src-git\(-full\)\? $name .*\^" feeds.conf.default || {
              echo "pin for $name did not apply" >&2
              exit 1
            }
          done
          grep -q '^src-link awg ' feeds.conf.default || echo "src-link awg $PWD/awg-feed" >> feeds.conf.default
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure
        run: |
          cd owrt
          cp ../repo/config.buildinfo .config
          sed -i \
            -e '/^CONFIG_PACKAGE_luci-app-be7000-update=/d' \
            -e '/^# CONFIG_PACKAGE_luci-app-be7000-update is not set$/d' \
            -e '/^CONFIG_SIGNED_PACKAGES=/d' \
            -e '/^# CONFIG_SIGNED_PACKAGES is not set$/d' \
            -e '/^CONFIG_SIGNATURE_CHECK=/d' \
            -e '/^# CONFIG_SIGNATURE_CHECK is not set$/d' .config
          echo '# CONFIG_PACKAGE_luci-app-be7000-update is not set' >> .config
          # This image consumes the existing signed feeds but does not publish
          # a new feed, so it needs the public trust key, not the private key.
          echo '# CONFIG_SIGNED_PACKAGES is not set' >> .config
          echo 'CONFIG_SIGNATURE_CHECK=y' >> .config
          echo 'CONFIG_DEVEL=y' >> .config
          echo 'CONFIG_CCACHE=y' >> .config
          # Tachyon 1.5.21: bundle dependencies missing from this firmware's
          # signed aarch64_cortex-a73 and matching kernel feed.
          # Keep the running firmware kernel ABI: do not select kmod-inet-diag
          # in this compatibility build. It requires a separate kernel plan.
          for pkg in coreutils-base64 coreutils-timeout curl bind-dig ip-full; do
            echo "CONFIG_PACKAGE_$pkg=y" >> .config
          done
          {
            echo "CONFIG_IMAGEOPT=y"
            echo "CONFIG_VERSIONOPT=y"
            echo "CONFIG_VERSION_DIST=\"Beam WRT\""
            echo "CONFIG_VERSION_NUMBER=\"$PROJECT_VERSION\""
            echo "CONFIG_VERSION_CODE=\"$VERSION_STRING\""
            echo "CONFIG_VERSION_MANUFACTURER=\"Beam WRT\""
            echo "CONFIG_VERSION_MANUFACTURER_URL=\"https://github.com/timofey-maykov/be7000-openwrt\""
            echo "CONFIG_VERSION_HOME_URL=\"https://github.com/timofey-maykov/be7000-openwrt\""
            echo "CONFIG_VERSION_BUG_URL=\"https://github.com/timofey-maykov/be7000-openwrt/issues\""
            echo "CONFIG_VERSION_SUPPORT_URL=\"https://4pda.to/forum/index.php?showtopic=1070166\""
            echo "CONFIG_VERSION_PRODUCT=\"Xiaomi BE7000\""
            echo "# CONFIG_VERSION_FILENAMES is not set"
            echo "# CONFIG_VERSION_CODE_FILENAMES is not set"
          } >> .config
          make defconfig
          grep -q '^# CONFIG_SIGNED_PACKAGES is not set' .config
          grep -q '^CONFIG_SIGNATURE_CHECK=y' .config
          grep -q '^CONFIG_CCACHE=y' .config
          grep -q '^CONFIG_VERSION_DIST="Beam WRT"' .config
          grep -q '^CONFIG_VERSION_NUMBER="1.3.1-QWRT"' .config
          for pkg in coreutils-base64 coreutils-timeout curl bind-dig ip-full; do
            grep -q "^CONFIG_PACKAGE_$pkg=y$" .config || {
              echo "Package not available in pinned build: $pkg" >&2
              exit 1
            }
          done

      - name: Cache toolchain and sources
        uses: actions/cache@v4
        with:
          path: |
            owrt/dl
            owrt/build_dir/host*
            owrt/build_dir/toolchain*
            owrt/staging_dir/host*
            owrt/staging_dir/toolchain*
          key: owrt-${{ env.OWRT_COMMIT }}-${{ hashFiles('repo/feeds-pins.txt') }}
          restore-keys: |
            owrt-${{ env.OWRT_COMMIT }}-

      - name: Cache compiler output
        uses: actions/cache@v4
        with:
          path: owrt/.ccache
          key: ccache-${{ env.OWRT_COMMIT }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ env.OWRT_COMMIT }}-

      - name: Download sources
        run: cd owrt && make -j"$(nproc)" download

      - name: Build toolchain and kernel
        run: |
          cd owrt
          make -j"$(nproc)" tools/install toolchain/install || make -j1 V=s tools/install toolchain/install
          make -j"$(nproc)" target/linux/compile || make -j1 V=s target/linux/compile

      - name: Check running BE7000 kernel identity before packaging
        run: |
          set -eu
          actual="$(cat owrt/build_dir/target-*/linux-*/linux-*/.vermagic)"
          expected="e9cfef63d69f7689bbe64561df80476a"
          mkdir -p out-kernel-diagnostics
          printf '%s\n' "$actual" > out-kernel-diagnostics/built-vermagic.txt
          printf '%s\n' "$expected" > out-kernel-diagnostics/router-vermagic.txt
          cp owrt/.config out-kernel-diagnostics/openwrt-config.txt
          find owrt/build_dir/target-* -path '*/linux-*/linux-*/.config' -exec cp '{}' out-kernel-diagnostics/kernel-config.txt \; -quit
          if [ "$actual" != "$expected" ]; then
            echo "::error::Baseline BE7000 kernel mismatch: running=$expected built=$actual. Refusing to publish incompatible module."
            exit 1
          fi
          echo "BE7000 kernel identity matches; package may proceed."

      - name: Upload kernel diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: be7000-kernel-diagnostics-${{ github.run_number }}
          path: out-kernel-diagnostics/*
          if-no-files-found: ignore
          retention-days: 14

      - name: Point image at the matching kernel-module feed
        run: |
          cd owrt
          VERMAGIC=$(cat build_dir/target-*/linux-*/linux-*/.vermagic)
          echo "VERMAGIC=$VERMAGIC" >> "$GITHUB_ENV"
          f=files/etc/apk/repositories.d/customfeeds.list
          sed -i "s|feed/targets/$TARGET/packages/packages.adb|feed/targets/$TARGET/$VERMAGIC/packages/packages.adb|" "$f"
          grep "feed/targets" "$f"
          {
            echo "VERSION=$PROJECT_VERSION"
            echo "TAG=qwrt"
            echo "PROJECT_SOURCE_COMMIT=$PROJECT_SOURCE_COMMIT"
            echo "DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "BUILD=${{ github.run_id }}"
            echo "KERNEL=$VERMAGIC"
          } > files/etc/be7000-release
          cat files/etc/be7000-release

      - name: Build firmware
        run: cd owrt && (make -j"$(nproc)" world || make -j1 V=s world)

      - name: ccache statistics
        if: always()
        run: cd owrt && (staging_dir/host/bin/ccache -s 2>/dev/null || ccache -s 2>/dev/null || echo "no ccache binary yet")

      - name: Check the QWRT image
        run: |
          cd owrt
          img=bin/targets/$TARGET/$DEVICE-squashfs-factory.ubi
          ls -la "$img" bin/targets/$TARGET/$DEVICE-squashfs-sysupgrade.bin
          ! grep -rlE "hfdbg|HFDBG|192\.168\.11\." build_dir/target-*/root-qualcommbe/etc
          test -L build_dir/target-*/root-qualcommbe/etc/rc.d/S99be7000-bootconfirm
          grep -q 'CI_ROOTPART="rootfs"' target/linux/qualcommbe/ipq95xx/base-files/lib/upgrade/platform.sh
          ! grep -q 'fw_setenv flag_' target/linux/qualcommbe/ipq95xx/base-files/lib/upgrade/platform.sh
          ! grep -q 'fw_setenv flag_' build_dir/target-*/root-qualcommbe/etc/init.d/be7000-bootconfirm
          grep -q 'vol_name=rootfs' target/linux/qualcommbe/image/ipq95xx.mk
          dts=target/linux/qualcommbe/dts/ipq9574-be7000.dts
          grep -q 'ubi.block=0,rootfs root=/dev/ubiblock0_1' "$dts"
          ! grep -q 'ubi.mtd=overlay' "$dts"
          ! grep -q 'rootfs_1' target/linux/qualcommbe/ipq95xx/base-files/lib/upgrade/platform.sh
          grep -q 'regulator_fixed_1p8' "$dts"
          ! grep -q 'mp5496_l2: l2' "$dts"
          grep -q 'mlo-global-mem@57300000' "$dts"
          grep -q 'reg = <0x0 0x57300000 0x0 0xc00000>' "$dts"
          grep -q 'wifi_5g_rf_default:' "$dts"
          ! grep -q 'wifi-5g-rf-select[01]-hog' "$dts"
          for p in 308-wifi-ath12k-dt-board-id-selects-dualmac.patch \
                   309-wifi-ath12k-pci-fixed-mem-keep-all-segments.patch \
                   310-wifi-ath12k-board-id-parameter.patch; do
            test -s "package/kernel/mac80211/patches/ath12k/$p"
          done
          ! test -e build_dir/target-*/root-qualcommbe/usr/sbin/be7000-update
          grep -q "option enabled '0'" build_dir/target-*/root-qualcommbe/etc/config/bigoverlay
          test -s build_dir/target-*/root-qualcommbe/etc/apk/keys/public-key.pem
          test -x build_dir/target-*/root-qualcommbe/usr/sbin/be7000-5g-split
          test -s build_dir/target-*/root-qualcommbe/lib/firmware/ath12k/QCN9274/hw2.0/board.bin
          test -L build_dir/target-*/root-qualcommbe/etc/rc.d/S09be7000-5g-split

      - name: Prepare sysupgrade artifact
        run: |
          mkdir -p out-qwrt
          image="owrt/bin/targets/$TARGET/$DEVICE-squashfs-sysupgrade.bin"
          cp "$image" out-qwrt/xiaomi-be7000-qwrt-squashfs-sysupgrade.bin
          manifest="$(find "owrt/bin/targets/$TARGET" -maxdepth 1 -type f -name '*.manifest' -print -quit)"
          if [ -n "$manifest" ]; then
            cp "$manifest" out-qwrt/manifest.txt
          else
            echo "No target manifest found; continuing with the required sysupgrade image."
          fi
          cp repo/profiles/qwrt/README.md out-qwrt/README.txt
          cp repo/source.buildinfo out-qwrt/source.buildinfo
          (cd out-qwrt && sha256sum xiaomi-be7000-qwrt-squashfs-sysupgrade.bin > sha256sums.txt)

      - name: Prepare Tachyon dependencies artifact
        run: |
          set -eu
          mkdir -p out-tachyon-deps
          for pkg in coreutils-base64 coreutils-timeout curl bind-dig ip-full; do
            # Fail closed if a package was not built from this exact source tree.
            candidates="$(find owrt/bin/packages owrt/bin/targets -type f -name "$pkg-[0-9]*.apk" -print)"
            count="$(printf '%s\n' "$candidates" | sed '/^$/d' | wc -l)"
            if [ "$count" -ne 1 ]; then
              echo "Expected exactly one APK for $pkg; got $count" >&2
              exit 1
            fi
            cp "$candidates" out-tachyon-deps/
          done
          # Never install a kernel module without verifying exact vermagic.
          cat owrt/build_dir/target-*/linux-*/linux-*/.vermagic > out-tachyon-deps/kernel-vermagic.txt
          echo "$OWRT_COMMIT" > out-tachyon-deps/source-commit.txt
          (cd out-tachyon-deps && sha256sum ./*.apk > SHA256SUMS)
          echo "USERSPACE DEPENDENCIES ONLY: kmod-inet-diag is NOT included. Do not install a module from a different kernel build. Tachyon itself is NOT ready." > out-tachyon-deps/README.txt

      - name: Upload Tachyon dependencies
        uses: actions/upload-artifact@v4
        with:
          name: be7000-tachyon-deps-${{ github.run_number }}
          path: out-tachyon-deps/*
          if-no-files-found: error
          retention-days: 14

      - name: Upload sysupgrade artifact
        uses: actions/upload-artifact@v4
        with:
          name: xiaomi-be7000-qwrt-squashfs-sysupgrade-${{ github.run_number }}
          path: out-qwrt/*
          if-no-files-found: error
          retention-days: 14
